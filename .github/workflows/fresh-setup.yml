# Runs the demo the way a newcomer does: a fresh runner, `./run.sh setup`,
# then the four scenarios, each checked against the outcome in AGENTS.md.
#
# Weekly, because the demo pins exact releases but installs their
# dependencies fresh: a later release of a dependency can break a fresh
# setup without any change here. That is how the demo was broken from
# 2026-10-17 to 2026-11-16 unnoticed (Kyvvu/platform#1055).
name: Fresh setup

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kyvvu_version:
        description: "kyvvu SDK version to install (empty: the one run.sh pins)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scenarios:
    name: "scenarios (${{ matrix.python }} Python)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Where the venv's interpreter lives. Under SHADI the agent must be able
        # to read it; run.sh adds its base installation to the sandbox's `read`.
        python: [system, setup-python, uv]
    env:
      KYVVU_VERSION: ${{ inputs.kyvvu_version }}
    steps:
      - uses: actions/checkout@v4

      - name: "Interpreter: system (/usr/bin/python3)"
        if: matrix.python == 'system'
        run: echo "PYTHON=/usr/bin/python3" >> "$GITHUB_ENV"

      - name: "Interpreter: actions/setup-python (/opt/hostedtoolcache)"
        if: matrix.python == 'setup-python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Interpreter: setup-python into PYTHON"
        if: matrix.python == 'setup-python'
        run: echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      - name: "Interpreter: uv-managed (~/.local/share/uv)"
        if: matrix.python == 'uv'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" python install 3.12
          echo "PYTHON=$("$HOME/.local/bin/uv" python find 3.12)" >> "$GITHUB_ENV"

      - name: Setup, as a newcomer runs it
        run: |
          # An empty KYVVU_VERSION would override run.sh's pin with nothing.
          [ -n "$KYVVU_VERSION" ] || unset KYVVU_VERSION
          export PATH="$HOME/.local/bin:$PATH"
          echo "PYTHON=$PYTHON"
          ./run.sh setup
          echo "--- my-agent/sandbox.json"; cat my-agent/sandbox.json
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          my-agent/.venv/bin/pip list 2>/dev/null | grep -i -E '^kyvvu'
          shadictl --version || true

      - name: "1: Kyvvu permits; the generated code rewrites agent.py"
        run: |
          ./run.sh 1 | tee out-1.txt
          grep -q 'agent.py modified' out-1.txt

      - name: "2: no approval gate, so Kyvvu refuses run_code"
        run: |
          ./run.sh 2 | tee out-2.txt
          grep -q 'Kyvvu blocked: .*Code execution requires a preceding gate' out-2.txt
          grep -q 'agent directory unchanged' out-2.txt

      - name: "3a: under SHADI, harmless code writes result.txt"
        run: |
          ./run.sh 3a | tee out-3a.txt
          grep -q 'result.txt: 42' out-3a.txt
          grep -q 'agent directory unchanged' out-3a.txt

      - name: "3b: under SHADI, the kernel refuses the write to agent.py"
        run: |
          ./run.sh 3b 2>&1 | tee out-3b.txt
          grep -q 'PermissionError' out-3b.txt
          grep -q 'agent directory unchanged' out-3b.txt

      - name: "examples: three further Kyvvu policies, each outcome checked"
        run: |
          ./run.sh examples | tee out-examples.txt
          grep -q 'all outcomes as expected' out-examples.txt
